<script>
// cinecode QUICK MODE starter. One file holds the whole film: timeline, scenes, on-screen text and the sound.
//
// Contract used by tools/capture.mjs:
//   window.READY            Promise<{frames, fps, width, height, renderer, title, bounds, vo}>, resolves after fonts are
//                           loaded (bounds = scene starts + the end, for tools/make.py and the per-scene checks)
//   window.renderFrame(i)   draws frame i; a pure function of (i / FPS, SEED); nothing carried between frames
//   window.captureFrame(i)  renderFrame(i) + returns a PNG/JPEG data URL of the canvas
//   window.renderAudio()    Promise<AudioBuffer>: the whole soundtrack, rendered OFFLINE (OfflineAudioContext)
// URL params: w, h (default 1080x1920 = 9:16), seed, capture=1 (set by capture.mjs: no preview loop),
//             shutter=<samples> (0 = motion blur off, for drafts), weave=<px>, tone=0 (finishing overrides)
//
// Renders: python3 tools/make.py stills | draft | final (KIT/references/quick-mode.md §3-4). It captures, lays the
// narration on the score (audio/mix.json), masters to -14 LUFS and runs the checks; never chain capture.mjs,
// master_audio.py and qc.py by hand.
//
// Edit only the FILM section below: TITLE, PURPOSE, FINISH, DURATION, PALETTE, TYPE (roles, check), CUES, VO, SCENES, SFX, ROOM,
// ARRANGEMENT, the scene functions and score(). Helpers stay as they are: EASE, MOTION (at, back, anticipate, spring, stagger, arc), CAM (pan, tilt, dolly, zoom, truck, crane, orbit, dollyZoom,
// pushTo, fpv, handheld, matchFrom, rackFocus), retime() (speed ramp, slow motion, time-lapse, freeze), plane(),
// TRANSITION (dissolve, wipe, whip, iris), lazy() (seeded data built once), label() (on-screen names), and the sound voices.
// Seeded data (star fields, layouts) is built with lazy() and first used inside a draw call: SEED is set further down
// the file, so a top-level rng() call here would run before it.

// ============================== FILM ==============================
const TITLE = 'Allscore Tek Kişilik Tribün';
// Purpose (SKILL.md "First questions"): 'cinematic' or 'ad'.
const PURPOSE = 'ad';
// Look: authored "Gece stadı" on the cinematic-realistic family: sodium floodlights in fog, backlit black silhouettes,
// Allscore green carried only by the app (notifications, the phone's glow, the fan's scarf).
const LOOKS = {
  'night-stadium': { grade: 'contrast(1.08) saturate(0.96)', bloom: 0.32, texture: null, vignette: 0.38, grain: 0.045, grainHold: 1, hold: 30, line: 0, steps: 0,
    palette: { bg: '#040E17', ink: '#F4F6F8', accent: '#05D16E', dim: '#1B2A3A' } },
};
const LOOK_ID = 'night-stadium';
const LOOK = LOOKS[LOOK_ID];
const FINISH = { shutter: null, weave: 0, tone: null };
const FPS = 30;
const DURATION = 30;
const BPM = 100;
const BEAT0 = 0;
const beat = (n) => BEAT0 + n * 60 / BPM, bar = (n) => beat(4 * n);
const OWN_MUSIC = null;                     // the user picked a real open-licence recording; set once it is fetched
const INSTRUMENTS = [];
const CAST = {};
const FORMULAS = {};
// Allscore's mark: navy ground, green lead, white. Sodium is the world's light, never the brand's.
const PALETTE = { bg: '#040E17', ink: '#F4F6F8', accent: '#05D16E', dim: '#1B2A3A', sodium: '#F2A23A', flare: '#E0412F', fog: '#0B1A28' };
const TYPE = {
  lang: 'tr',
  roles: {
    display: { family: 'Barlow Condensed', files: { 600: 'fonts/BarlowCondensed-600.woff2', 700: 'fonts/BarlowCondensed-700.woff2', 800: 'fonts/BarlowCondensed-800.woff2' } },
    text: { family: 'Inter', files: { 400: 'fonts/Inter-400.woff2', 600: 'fonts/Inter-600.woff2' } },
    mono: null,
  },
  check: { strings: { display: ['GOL', 'DEREBOYU SK', 'Tüm skorlar, tek uygulama.', 'İĞÜŞÖÇ'], text: ['3. Lig\'e yükseldi', 'Süper Lig\'de', 'allscore.live'] }, sizes: { text: 0.04 } },
};

// One timeline for picture and sound.
const CUES = {
  phone: 0,          // the phone lights up in the crane cab
  out: 2.4,          // cut outside: the crane, the empty pitch
  promo: 6,          // "3. Lig'e yükseldi": scarves tied on the fence, one, then ten
  seasons: 10,       // time-lapse: the stand rises round the pitch, flares, "2. Lig", "1. Lig"
  truss: 15,         // the last roof truss swings in
  lock: 17.4,        // the truss locks; the roof light runs round the arc
  top: 19,           // top down: the stadium is the Allscore mark
  goal: 20,          // 90+3 GOL on the phone in the stand, half a beat of silence
  roar: 20.6,        // the stadium roars
  wide: 21.8,        // the fan in the stand, scarf over his head; above him the cab stands empty
  card: 26.5,        // the end card
  end: DURATION,
};

const VO = [];                              // narration lines come after the voice pick
const CAPTIONS = null;
const CAPTION_STYLE = { role: 'display', accentRole: 'display', size: 0.062, caps: false, ink: PALETTE.ink, hi: PALETTE.ink, accent: PALETTE.accent, punch: 0.07 };

const SCENES = [
  { chapter: 'C1', from: CUES.phone, to: CUES.out, draw: phoneLights, action: 'the phone lights up and buzzes on the cab dash', amb: { kind: 'water', gain: 0.06 } },
  { chapter: 'C1', from: CUES.out, to: CUES.promo, draw: fanLeansOut, action: 'the lone fan leans out of the crane cab, scarf unfurling', in: { type: 'cut' }, amb: { kind: 'air', gain: 0.06 } },
  { chapter: 'C2', from: CUES.promo, to: CUES.seasons, draw: scarvesTie, action: 'scarves are tied on the fence, one, then ten, as people arrive', in: { type: 'cut' }, amb: { kind: 'air', gain: 0.06 } },
  { chapter: 'C2', from: CUES.seasons, to: CUES.truss, draw: standRises, action: 'the stand rises round the pitch season by season, flares light', in: { type: 'cut' }, amb: { kind: 'city', gain: 0.06 } },
  { chapter: 'C3', from: CUES.truss, to: CUES.goal, draw: trussLocks, action: 'the last roof truss locks and the roof light runs round the ring', in: { type: 'cut' }, amb: { kind: 'city', gain: 0.07 } },
  { chapter: 'C4', from: CUES.goal, to: CUES.wide, draw: goalBuzzes, action: 'the phone in the fan\'s hand buzzes with the 90+3 goal, then the crowd rises', in: { type: 'smash' }, amb: { kind: 'room', gain: 0.01 } },
  { chapter: 'C4', from: CUES.wide, to: CUES.card, draw: fanInStand, action: 'the fan raises his scarf in the full stand; the cab above is empty', in: { type: 'cut' }, amb: { kind: 'city', gain: 0.09 } },
  { chapter: 'C5', from: CUES.card, to: CUES.end, draw: markCloses, action: 'the Allscore ring draws itself and its three dots land', in: { type: 'cut' }, amb: { kind: 'city', gain: 0.03 } },
];

// Every picture event gets its sound (review/sound-audit.md). Designed accents: 1 riser, 2 whooshes, 2 full hits.
// The chime is the film's signature: Allscore's notification, two soft notes, returning at every step of the rise.
const SFX = [
  { at: 0.05, voice: 'buzz', gain: 0.5, wet: 0.05 },                    // the phone rattles on the dash
  { at: 0.32, voice: 'chime', gain: 0.32, wet: 0.2 },                   // the GOL card lands
  { at: 1.2, voice: 'foley', kind: 'tap', gain: 0.12, wet: 0.1 },       // rain beads hit the glass as we pull back
  { at: CUES.out, voice: 'hum', dur: 3.6, gain: 0.08, wet: 0.3 },       // the one failing lamp's ballast hum, flickering
  { at: CUES.out + 0.5, voice: 'foley', kind: 'cloth', gain: 0.22, wet: 0.2 },   // he stands
  { at: CUES.out + 1.1, voice: 'foley', kind: 'step', gain: 0.25, wet: 0.2 },    // a boot on the cab floor
  { at: CUES.out + 1.6, voice: 'flap', dur: 2.2, gain: 0.2, wet: 0.25 }, // the scarf takes the wind
  { at: CUES.promo + 0.1, voice: 'chime', gain: 0.32, wet: 0.2 },       // 3. Lig
  { at: CUES.promo + 0.9, voice: 'foley', kind: 'cloth', gain: 0.25, wet: 0.2 },  // the first scarf tied
  { at: CUES.promo + 1.6, voice: 'steps', dur: 2.2, gain: 0.2, wet: 0.25 },       // people arrive on the gravel
  { at: CUES.promo + 2.4, voice: 'claps', dur: 1.6, gain: 0.22, wet: 0.35 },      // the first handful of applause
  { at: CUES.seasons - 0.35, voice: 'whoosh', dur: 0.7, gain: 0.28, wet: 0.25 },  // into the time-lapse
  { at: CUES.seasons + 0.2, voice: 'chime', gain: 0.3, wet: 0.2 },      // 2. Lig
  { at: CUES.seasons + 0.6, voice: 'roar', dur: 4.4, gain: 0.32, rise: 1, wet: 0.4 },   // the crowd grows with the stand
  { at: CUES.seasons + 2.2, voice: 'chime', gain: 0.3, wet: 0.2 },      // 1. Lig
  { at: CUES.seasons + 3.0, voice: 'hiss', dur: 2.0, gain: 0.12, wet: 0.3 },   // flares lit
  { at: CUES.truss + 0.1, voice: 'creak', dur: 1.6, gain: 0.22, wet: 0.45 },   // the truss swings on its cable
  { at: CUES.lock - 1.6, voice: 'riser', dur: 1.6, gain: 0.22, wet: 0.3 },     // into the lock
  { at: CUES.lock, voice: 'clank', gain: 0.6, wet: 0.5 },               // steel locks on steel
  { at: CUES.lock, voice: 'hit', gain: 0.5, wet: 0.45 },
  { at: CUES.lock + 0.15, voice: 'lamps', dur: 1.3, gain: 0.1, wet: 0.4 },     // the roof lamps clack on round the ring
  { at: CUES.top + 0.1, voice: 'chime', gain: 0.36, wet: 0.35 },        // the mark seen from above
  { at: CUES.goal, voice: 'buzz', gain: 0.55, wet: 0.05 },              // 90+3: the phone first, then half a beat of silence
  { at: CUES.goal + 0.08, voice: 'chime', gain: 0.34, wet: 0.15 },
  { at: CUES.roar, voice: 'roar', dur: 5.9, gain: 0.95, wet: 0.45 },    // the stadium erupts
  { at: CUES.roar, voice: 'hit', gain: 0.75, wet: 0.5 },
  { at: CUES.wide, voice: 'claps', dur: 4.0, gain: 0.3, wet: 0.4 },
  { at: CUES.wide + 0.2, voice: 'flap', dur: 2.5, gain: 0.18, wet: 0.2 },   // the scarf held up between two hands
  { at: CUES.card - 0.35, voice: 'whoosh', dur: 0.7, gain: 0.25, wet: 0.25 },
  { at: CUES.card + 0.6, voice: 'chime', gain: 0.42, wet: 0.35, big: true },   // the dots land: the brand's sound
];
// The film's own designed voices for SFX rows, built from the engine's noise and envelopes.
const FILM_VOICES = {
  buzz: (ctx, out, e) => { for (const d of [0, 0.32]) { const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), v = ctx.createGain(); o.type = 'square'; o.frequency.value = 172; lp.type = 'lowpass'; lp.frequency.value = 700;
    env(v.gain, e.at + d, 0.01, e.gain * 0.5, 0.22); o.connect(lp).connect(v).connect(out); o.start(e.at + d); o.stop(e.at + d + 0.3); foley(ctx, out, e.at + d, 'tap', e.gain * 0.25); } },
  chime: (ctx, out, e) => { [[hz('E5'), 0], [hz('B5'), 0.09]].concat(e.big ? [[hz('E6'), 0.18]] : []).forEach(([f, d]) => { for (const [m, gg] of [[1, 1], [2.01, 0.18]]) { const o = ctx.createOscillator(), v = ctx.createGain(); o.type = 'sine'; o.frequency.value = f * m;
    env(v.gain, e.at + d, 0.004, e.gain * gg * 0.5, e.big ? 1.4 : 0.7); o.connect(v).connect(out); o.start(e.at + d); o.stop(e.at + d + 1.6); } }); },
  hum: (ctx, out, e) => { const o = ctx.createOscillator(), v = ctx.createGain(); o.type = 'sawtooth'; o.frequency.value = 100; const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    v.gain.setValueAtTime(0.0001, e.at); for (let t = e.at; t < e.at + e.dur; t += 1 / 30) v.gain.setValueAtTime(e.gain * (noise1(t * 9 + 3) > 0.18 ? 1 : 0.15), t); v.gain.setValueAtTime(0.0001, e.at + e.dur);
    o.connect(lp).connect(v).connect(out); o.start(e.at); o.stop(e.at + e.dur + 0.05); },
  flap: (ctx, out, e) => { for (let t = e.at; t < e.at + e.dur; t += 0.11 + 0.05 * hash1(Math.round(t * 100))) foley(ctx, out, t, 'cloth', e.gain * (0.5 + 0.5 * hash1(Math.round(t * 77)))); },
  steps: (ctx, out, e) => { for (let t = e.at, i = 0; t < e.at + e.dur; t += 0.28 + 0.1 * hash1(i), i++) foley(ctx, out, t, 'step', e.gain * (0.6 + 0.4 * hash1(i + 9))); },
  claps: (ctx, out, e) => { const n = Math.round(e.dur * 26); for (let i = 0; i < n; i++) { const t = e.at + e.dur * hash1(i * 3 + 1); foley(ctx, out, t, 'tap', e.gain * (0.3 + 0.7 * hash1(i * 7 + 2)) * Math.sin(Math.PI * (t - e.at) / e.dur)); } },
  roar: (ctx, out, e) => { const s = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), lp = ctx.createBiquadFilter(), v = ctx.createGain(); s.buffer = noiseBuffer(ctx, 6, 311); s.loop = true;
    bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.5; lp.type = 'lowpass'; lp.frequency.value = 3200; const a = e.rise ? e.dur * 0.9 : 0.35;
    v.gain.setValueAtTime(0.0001, e.at); v.gain.linearRampToValueAtTime(e.gain, e.at + a); for (let t = e.at + a; t < e.at + e.dur - 0.5; t += 0.4) v.gain.linearRampToValueAtTime(e.gain * (0.8 + 0.2 * noise1(t * 2 + 5)), t + 0.4);
    v.gain.linearRampToValueAtTime(0.0001, e.at + e.dur); s.connect(bp).connect(lp).connect(v).connect(out); s.start(e.at, 1.3); s.stop(e.at + e.dur + 0.1); },
  hiss: (ctx, out, e) => { const s = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), v = ctx.createGain(); s.buffer = noiseBuffer(ctx, 3, 41); s.loop = true; hp.type = 'highpass'; hp.frequency.value = 2600;
    v.gain.setValueAtTime(0.0001, e.at); v.gain.linearRampToValueAtTime(e.gain, e.at + 0.3); v.gain.linearRampToValueAtTime(0.0001, e.at + e.dur); s.connect(hp).connect(v).connect(out); s.start(e.at); s.stop(e.at + e.dur + 0.05); },
  creak: (ctx, out, e) => { const o = ctx.createOscillator(), bp = ctx.createBiquadFilter(), v = ctx.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(48, e.at); o.frequency.linearRampToValueAtTime(61, e.at + e.dur);
    bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 6; env(v.gain, e.at, 0.3, e.gain, e.dur); o.connect(bp).connect(v).connect(out); o.start(e.at); o.stop(e.at + e.dur + 0.4); },
  clank: (ctx, out, e) => { for (const [f, q, d] of [[1240, 30, 1.2], [2710, 40, 0.9], [610, 20, 1.6]]) { const s = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), v = ctx.createGain(); s.buffer = noiseBuffer(ctx, 0.08, Math.round(f));
    bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q; env(v.gain, e.at, 0.001, e.gain * 6, d); s.connect(bp).connect(v).connect(out); s.start(e.at); } },
  lamps: (ctx, out, e) => { for (let i = 0; i < 14; i++) { const t = e.at + e.dur * i / 14; foley(ctx, out, t, 'tap', e.gain * (1 - i / 20)); } },
};
const ROOM = { secs: 2.6, decay: 3.4, tone: 4200 };
const ARRANGEMENT = [
  { section: 'alone', from: 0, to: CUES.promo, parts: [] },
  { section: 'grow', from: CUES.promo, to: CUES.truss, parts: [] },
  { section: 'summit', from: CUES.truss, to: CUES.goal, parts: [] },
  { section: 'roar', from: CUES.goal, to: CUES.end, parts: [] },
];

// ---------------- the 3D world (three.js, loaded locally before READY) ----------------
// World in metres, y up. Pitch at the origin along x. The tower crane stands in the south-east gap of the future
// stadium ring, where the Allscore mark leaves its opening; its cab looks north-west over the pitch.
const RING = { R: 118, r: 76, start: 17, len: 239 };            // the roof arc in degrees, measured from the logo
const CRANE = { x: 0.8 * 118, z: 0.18 * 118, h: 46 };           // the logo's upper green dot: the cab, the fan's seat
const W3 = {};                                                    // built once, reused by every frame
function three() {
  if (W3.ready) return W3;
  const T = window.THREE, r = rng(101);
  const renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: false });
  renderer.setPixelRatio(1); renderer.setSize(W, H, false);
  renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = T.SRGBColorSpace;
  const scene = new T.Scene();
  scene.background = new T.Color('#050d16');
  const sky = new T.Mesh(new T.SphereGeometry(1800, 32, 16), new T.ShaderMaterial({ side: T.BackSide, depthWrite: false, fog: false,   // the city's sodium glow low on the horizon
    vertexShader: 'varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'varying vec3 p; void main(){ float h = clamp(p.y, -0.1, 1.0); vec3 top = vec3(0.012, 0.03, 0.055); vec3 hor = vec3(0.11, 0.075, 0.05); gl_FragColor = vec4(mix(hor, top, pow(clamp(h * 3.0, 0.0, 1.0), 0.6)), 1.0); }' })); scene.add(sky);
  scene.fog = new T.FogExp2(PALETTE.fog, 0.011);
  const cam = new T.PerspectiveCamera(38, W / H, 0.03, 3000);
  const std = (c, o = {}) => new T.MeshStandardMaterial({ color: c, roughness: 0.85, metalness: 0.05, ...o });
  const add = (m, p) => { (p || scene).add(m); return m; };

  // sky glow: a faint sodium dome low on the horizon (the city behind the fog)
  const hemi = new T.HemisphereLight('#24384f', '#0a0604', 0.55); scene.add(hemi); W3.hemi = hemi;
  const rim = new T.DirectionalLight('#8fb0d8', 0.9); rim.position.set(-120, 60, -40); scene.add(rim); W3.rim = rim;   // the city's cold glow behind the pitch: rims every silhouette

  // ground: the amateur pitch, worn to mud in the goalmouths and the centre, puddles that catch the floodlight
  const gc = document.createElement('canvas'); gc.width = 1024; gc.height = 1024;
  const gx = gc.getContext('2d');
  gx.fillStyle = '#17240f'; gx.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 9000; i++) { const a = r(), b = r(); gx.fillStyle = `rgba(${30 + 40 * r()},${40 + 50 * r()},${15 + 20 * r()},0.25)`; gx.fillRect(a * 1024, b * 1024, 2 + 4 * r(), 1 + 2 * r()); }
  const mud = (x, y, rx, ry) => { const gr = gx.createRadialGradient(x, y, 0, x, y, rx); gr.addColorStop(0, 'rgba(46,32,20,0.95)'); gr.addColorStop(1, 'rgba(46,32,20,0)'); gx.fillStyle = gr; gx.save(); gx.translate(x, y); gx.scale(1, ry / rx); gx.translate(-x, -y); gx.beginPath(); gx.arc(x, y, rx, 0, TAU); gx.fill(); gx.restore(); };
  mud(512, 512, 150, 110); mud(150, 512, 110, 160); mud(874, 512, 110, 160);
  for (let i = 0; i < 40; i++) mud(100 + 824 * r(), 220 + 584 * r(), 20 + 60 * r(), 10 + 40 * r());
  gx.strokeStyle = 'rgba(225,225,210,0.55)'; gx.lineWidth = 4;         // chalk lines, half washed out
  gx.strokeRect(112, 232, 800, 560); gx.beginPath(); gx.moveTo(512, 232); gx.lineTo(512, 792); gx.stroke();
  gx.beginPath(); gx.arc(512, 512, 80, 0, TAU); gx.stroke();
  gx.strokeRect(112, 392, 120, 240); gx.strokeRect(792, 392, 120, 240);
  const groundTex = new T.CanvasTexture(gc); groundTex.colorSpace = T.SRGBColorSpace; groundTex.anisotropy = 4;
  const rc = document.createElement('canvas'); rc.width = 512; rc.height = 512;      // roughness: puddles are glossy
  const rx = rc.getContext('2d'); rx.fillStyle = '#e0e0e0'; rx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 16; i++) { const x = 60 + 392 * r(), y = 120 + 272 * r(), s = 4 + 14 * r(); const gr = rx.createRadialGradient(x, y, 0, x, y, s); gr.addColorStop(0, '#151515'); gr.addColorStop(1, 'rgba(224,224,224,0)'); rx.fillStyle = gr; rx.beginPath(); rx.ellipse(x, y, s * 1.6, s, 0, 0, TAU); rx.fill(); }
  const roughTex = new T.CanvasTexture(rc);
  const ground = add(new T.Mesh(new T.PlaneGeometry(140, 140), std('#ffffff', { map: groundTex, roughnessMap: roughTex, roughness: 1, metalness: 0.0 })));
  ground.rotation.x = -Math.PI / 2;
  const outer = add(new T.Mesh(new T.PlaneGeometry(1400, 1400), std('#0b0f0a', { roughness: 0.95 })));
  outer.rotation.x = -Math.PI / 2; outer.position.y = -0.05;

  // soft additive glow sprite and the volumetric cone material
  const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'); const gr = x.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.2, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = gr; x.fillRect(0, 0, 128, 128); return new T.CanvasTexture(c); })();
  const glow = (color, size, p) => { const s = new T.Sprite(new T.SpriteMaterial({ map: glowTex, color, blending: T.AdditiveBlending, depthWrite: false, transparent: true, fog: false })); s.scale.set(size, size, 1); (p || scene).add(s); return s; };

// The world is a stack of flat planes; z = depth behind the subject plane (z = 0), negative = in front of it.

  tilt: (c, e, a, b) => { c.tilt += lerp(a, b, e); },         // + = up

        + `${noteName(lo)}–${noteName(hi)}): an octave ${want > hi ? 'lower' : 'higher'}, another player, or { stretch: true } for an effect`);
    }
    rate = Math.pow(2, (want - take.midi) / 12);
  }
  const src = ctx.createBufferSource(), g = ctx.createGain();
  src.buffer = take.buf; src.playbackRate.value = rate;
  g.gain.value = (o.gain ?? 0.8) * take.norm * (o.note != null ? 0.4 + 0.6 * vel : 1);
  let node = src.connect(g);
  if (o.pan) { const p = ctx.createStereoPanner(); p.pan.value = o.pan; node = node.connect(p); }
  node.connect(out); src.start(Math.max(0, t));
  return src;
}

function loadAudio(ctx, url) {              // a local WAV next to film.html (XHR works on file:// in the capture)
  return new Promise((ok, fail) => {
    const x = new XMLHttpRequest(); x.open('GET', url.replace(/#/g, '%23')); x.responseType = 'arraybuffer';
    x.onload = () => (x.status === 0 || x.status === 200) ? ctx.decodeAudioData(x.response).then(ok, fail)
      : fail(new Error(`own music: ${url} (${x.status})`));
    x.onerror = () => fail(new Error(`own music: could not load ${url}`)); x.send();
  });
}
window.renderAudio = async () => {
  const ctx = new OfflineAudioContext(2, Math.round(DURATION * SR), SR);
  const bus = ctx.createGain(); duck(bus.gain, 0.8, VO);
  const lim = ctx.createDynamicsCompressor();  // safety only; loudness is set afterwards by master_audio.py
  lim.threshold.value = -6; lim.knee.value = 6; lim.ratio.value = 8; lim.attack.value = 0.003; lim.release.value = 0.15;
  bus.connect(lim).connect(ctx.destination);
  ROOM_IN = makeRoom(ctx, bus);
  await loadSamples(ctx);
  SCENES.forEach((s, i) => { if (s.amb) ambience(ctx, wet(ctx, bus, 0.15), s.from, s.to, s.amb.kind, s.amb.gain, 300 + i); });
  for (const e of SFX) sfx(ctx, bus, e);
  if (OWN_MUSIC) {
    const src = ctx.createBufferSource(), gain = ctx.createGain();
    src.buffer = await loadAudio(ctx, OWN_MUSIC.file); gain.gain.value = OWN_MUSIC.gain ?? 0.8;
    src.connect(gain).connect(bus); src.start(0);
  } else score(ctx, bus);
  return ctx.startRendering();
};

window.READY = window.THREE_READY.then(() => loadType(TYPE)).then(loadFormulas).then(() => document.fonts.ready).then(() => {
  const qc = typeCheck(g, TYPE, W, H, PALETTE);  // missing glyphs or unreadable contrast stop here; warnings go to the log
  if (qc.errors.length) throw new Error('type check: ' + qc.errors.join(' · '));
  if (!OWN_MUSIC) checkArrangement();          // the user's own song brings its own arrangement
  return { frames: FRAMES, fps: FPS, width: W, height: H, renderer: 'canvas2d', qc: qc.warnings,
           title: TITLE, bounds: SCENES.map((s) => s.from).concat(DURATION), vo: VO.length,
           sfx: SFX.map((e) => [Math.round(e.at * 100) / 100, e.voice, e.dur ?? null]),
           palette: PALETTE, lookPalette: LOOK.palette, families: Object.values(TYPE.roles || {}).filter(Boolean).map((r) => r.family) };
});

// Text check (make.py runs it on drafts and finals, ?textcheck=1 only; renders never take this path). Every fillText and
// strokeText on a full-frame canvas is watched: its ink is the pixels it changed. Ink of two lines stacked over each
// other on the same pixels is an overlap; a piece of type whose face is within 2:1 of what is around half or more of
// its letters is low contrast. window.textCheck(frame) draws one frame and returns what it found there.
if (q.get('textcheck')) {
  const P = CanvasRenderingContext2D.prototype, owners = new WeakMap(), calls = [];
  let frameStart = 0, found = [];
  const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
  const lum = (r, gg, b) => 0.2126 * lin(r) + 0.7152 * lin(gg) + 0.0722 * lin(b);
  const rgbOf = (s) => {
    if (typeof s !== 'string') return null;
    if (s[0] === '#' && s.length === 7) return [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));
    const m = s.match(/rgba?\(([^)]+)\)/);
    return m ? m[1].split(',').slice(0, 3).map(Number) : null;
  };
  const watch = (orig, stroke) => function (str, x, y, ...rest) {
    const cv = this.canvas, s = String(str);
    if (cv.width !== W || cv.height !== H || !s.trim() || this.globalAlpha < 0.6) return orig.call(this, str, x, y, ...rest);
    const m = this.measureText(s), T = this.getTransform();
    const pts = [[x - m.actualBoundingBoxLeft, y - m.actualBoundingBoxAscent], [x + m.actualBoundingBoxRight, y - m.actualBoundingBoxAscent],
      [x - m.actualBoundingBoxLeft, y + m.actualBoundingBoxDescent], [x + m.actualBoundingBoxRight, y + m.actualBoundingBoxDescent]]
      .map(([px, py]) => [T.a * px + T.c * py + T.e, T.b * px + T.d * py + T.f]);
    const pad = 3 + (this.shadowBlur || 0) + Math.abs(this.shadowOffsetX || 0) + Math.abs(this.shadowOffsetY || 0);
    const x0 = Math.max(0, Math.floor(Math.min(...pts.map((p) => p[0])) - pad)), x1 = Math.min(W, Math.ceil(Math.max(...pts.map((p) => p[0])) + pad));
    const y0 = Math.max(0, Math.floor(Math.min(...pts.map((p) => p[1])) - pad)), y1 = Math.min(H, Math.ceil(Math.max(...pts.map((p) => p[1])) + pad));
    if (x1 - x0 < 2 || y1 - y0 < 2) return orig.call(this, str, x, y, ...rest);
    const before = this.getImageData(x0, y0, x1 - x0, y1 - y0).data;
    const result = orig.call(this, str, x, y, ...rest);
    const after = this.getImageData(x0, y0, x1 - x0, y1 - y0).data;
    const cap = Math.abs(T.d) * m.actualBoundingBoxAscent, base = T.b * x + T.d * y + T.f;
    const left = Math.min(...pts.map((p) => p[0])), right = Math.max(...pts.map((p) => p[0]));
    const last = calls.length > frameStart ? calls[calls.length - 1] : null, same = last && last.cv === cv;
    // the same string again at about the same place is a layer of one piece of type (extrusion, shadow, outline + fill)
    const layer = same && last.s === s && Math.abs(last.base - base) < 0.3 * cap && Math.abs(last.left - left) < 0.3 * cap;
    // apart: how far a baseline lies outside a piece of type's baselines (all its layers, an extrusion runs deep)
    const apart = (st, b) => Math.max(0, st.lo - b, b - st.hi);
    let run = same && apart(last.stack, base) <= 0.6 * Math.min(last.cap, cap) ? last.run : null;   // bouncing letters stay one line
    if (run && !layer) { run.label += (left - run.right > 0.25 * cap ? ' ' : '') + s; run.right = Math.max(run.right, right); }
    else if (!run) run = { label: s, right };
    let stack = layer ? last.stack : null;
    if (!stack) { if (last) settle(last.stack); stack = { run, ink: null, alpha: 0, cap: 0, overlapped: false, lo: base, hi: base }; }
    if (!stroke) { stack.ink = rgbOf(this.fillStyle); stack.alpha = this.globalAlpha; }   // a gradient face: colour unknown, not judged
    Object.assign(stack, { after, bw: x1 - x0, bh: y1 - y0, cap: Math.max(stack.cap, cap), lo: Math.min(stack.lo, base), hi: Math.max(stack.hi, base) });
    const id = calls.push({ s, base, cap, cv, run, left, right, stack }) - 1;
    let own = owners.get(cv);
    if (!own) { own = new Int32Array(W * H).fill(-1); owners.set(cv, own); }
    const hits = new Map(), bw = x1 - x0;
    for (let i = 0, n = before.length / 4; i < n; i++) {
      const k = i * 4;
      if (Math.abs(after[k] - before[k]) + Math.abs(after[k + 1] - before[k + 1]) + Math.abs(after[k + 2] - before[k + 2]) <= 30) continue;
      const idx = (y0 + Math.floor(i / bw)) * W + x0 + (i % bw), prev = own[idx];
      if (prev >= frameStart && calls[prev].run !== run && calls[prev].s !== s) hits.set(prev, (hits.get(prev) || 0) + 1);
      own[idx] = id;
    }
    for (const [prev, px] of hits) {          // only lines stacked over each other: letters side by side may touch by design
      const o = calls[prev], wide = Math.min(o.right - o.left, right - left);
      const gap = Math.max(0, o.stack.lo - stack.hi, stack.lo - o.stack.hi);
      const stacked = gap > 0.6 * Math.min(o.cap, cap) && Math.min(o.right, right) - Math.max(o.left, left) > 0.3 * wide;
      if (stacked && px >= 6) { found.push({ kind: 'overlap', a: o.run, b: run, px }); stack.overlapped = true; }
    }
    return result;
  };
  // The finished piece of type: its face (the last fill colour) against what is right around each letter after every
  // layer is drawn, so an outline or a shadow that separates the letters counts. A face that fills its whole box has
  // nothing around it: the type is lost in a ground of its own colour.
  function settle(st) {
    if (!st || st.done) return;
    st.done = true;
    if (!st.ink || st.overlapped || st.alpha < 0.85 || st.cap < 6) return;
    const [ir, ig, ib] = st.ink, li = lum(ir, ig, ib), { after, bw, bh } = st, R = Math.max(3, Math.round(st.cap * 0.12));
    const face = (xx, yy) => { const k = (yy * bw + xx) * 4; return Math.abs(after[k] - ir) + Math.abs(after[k + 1] - ig) + Math.abs(after[k + 2] - ib) < 48; };
    let faces = 0, low = 0, all = 0;
    for (let yy = 0; yy < bh; yy++) for (let xx = 0; xx < bw; xx++) {
      if (!face(xx, yy)) continue;
      faces++;
      if ((xx + yy) % 2) continue;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        let best = 0, edge = false;
        for (let d = 1; d <= R; d++) {
          const nx = xx + dx * d, ny = yy + dy * d;
          if (nx < 0 || ny < 0 || nx >= bw || ny >= bh) break;
          if (!edge && face(nx, ny)) continue;
          edge = true;
          const k = (ny * bw + nx) * 4, lb = lum(after[k], after[k + 1], after[k + 2]);
          best = Math.max(best, (Math.max(li, lb) + 0.05) / (Math.min(li, lb) + 0.05));
        }
        if (edge) { all++; if (best < 2) low++; }
      }
    }
    const share = faces > 0.7 * bw * bh ? 100 : all >= 20 ? Math.round((100 * low) / all) : 0;
    if (share >= 50) found.push({ kind: 'contrast', run: st.run, share });
  }
  P.fillText = watch(P.fillText, false);
  P.strokeText = watch(P.strokeText, true);
  window.textCheck = (frame) => {
    frameStart = calls.length; found = []; window.renderFrame(frame);
    if (calls.length > frameStart) settle(calls[calls.length - 1].stack);
    const out = new Map();                       // one finding per line pair (overlap) or line (contrast), the worst kept
    for (const f of found) {
      const r = f.kind === 'overlap' ? { kind: 'overlap', a: f.a.label, b: f.b.label, px: f.px } : { kind: 'contrast', s: f.run.label, share: f.share };
      if (r.kind === 'overlap' && r.a === r.b) continue;
      const key = r.kind === 'overlap' ? [r.a, r.b].sort().join('\u0000') : 'c\u0000' + r.s, old = out.get(key);
      if (!old || (r.px ?? r.share) > (old.px ?? old.share)) out.set(key, r);
    }
    return [...out.values()];
  };
}

// Preview in a normal browser: click renders the soundtrack offline and plays picture and sound together.
// The audio clock picks the frame; nothing is fed back into the render.
if (!q.get('capture')) {
  let frame = 0, playing = false, audio = null, src = null, t0 = 0, offset = 0;
  const hud = document.getElementById('hud');
  const stop = () => { if (src) { src.stop(); src = null; } playing = false; };
  const play = async () => {
    audio ??= new AudioContext();
    const buf = await window.renderAudio();
    src = audio.createBufferSource(); src.buffer = buf; src.connect(audio.destination);
    offset = frame / FPS; t0 = audio.currentTime; src.start(0, offset); playing = true;
    src.onended = () => { if (playing) { playing = false; frame = 0; } };
  };
  addEventListener('click', () => (playing ? stop() : play()));
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') playing ? stop() : play();
    if (e.code === 'ArrowRight') { stop(); frame = Math.min(FRAMES - 1, frame + 1); }
    if (e.code === 'ArrowLeft') { stop(); frame = Math.max(0, frame - 1); }
  });
  const loop = () => {
    if (playing) frame = Math.min(FRAMES - 1, Math.floor((audio.currentTime - t0 + offset) * FPS));
    window.renderFrame(frame);
    hud.textContent = `${TITLE} · frame ${frame}/${FRAMES - 1} · t=${(frame / FPS).toFixed(2)}s · ${playing ? 'playing' : 'click to play with sound'}`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
